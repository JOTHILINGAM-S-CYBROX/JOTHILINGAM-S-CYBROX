<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="100%" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="prod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="170" rx="16" fill="url(#bg)" stroke="#30363d"/>
  <text x="500" y="30" text-anchor="middle" fill="#8b949e" font-size="13" letter-spacing="3">CI/CD PIPELINE</text>

  <!-- connectors -->
  <g stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 5" opacity="0.8">
    <line x1="140" y1="85" x2="170" y2="85"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="278" y1="85" x2="308" y2="85"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="416" y1="85" x2="446" y2="85"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="554" y1="85" x2="584" y2="85"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="692" y1="85" x2="722" y2="85"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="830" y1="85" x2="860" y2="85"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/></line>
  </g>

  <!-- nodes -->
  <g fill="#0d1117" stroke="#58a6ff" stroke-width="2">
    <rect x="32" y="60" width="108" height="50" rx="10"><animate attributeName="stroke-opacity" values="0.25;1;0.25;0.25" keyTimes="0;0.08;0.2;1" dur="4.2s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="170" y="60" width="108" height="50" rx="10"><animate attributeName="stroke-opacity" values="0.25;1;0.25;0.25" keyTimes="0;0.08;0.2;1" dur="4.2s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="308" y="60" width="108" height="50" rx="10"><animate attributeName="stroke-opacity" values="0.25;1;0.25;0.25" keyTimes="0;0.08;0.2;1" dur="4.2s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="446" y="60" width="108" height="50" rx="10"><animate attributeName="stroke-opacity" values="0.25;1;0.25;0.25" keyTimes="0;0.08;0.2;1" dur="4.2s" begin="1.8s" repeatCount="indefinite"/></rect>
    <rect x="584" y="60" width="108" height="50" rx="10"><animate attributeName="stroke-opacity" values="0.25;1;0.25;0.25" keyTimes="0;0.08;0.2;1" dur="4.2s" begin="2.4s" repeatCount="indefinite"/></rect>
    <rect x="722" y="60" width="108" height="50" rx="10"><animate attributeName="stroke-opacity" values="0.25;1;0.25;0.25" keyTimes="0;0.08;0.2;1" dur="4.2s" begin="3s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="860" y="60" width="108" height="50" rx="10" fill="#0d1117" stroke="url(#prod)" stroke-width="2.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </rect>

  <!-- labels -->
  <g fill="#e6edf3" font-size="13" text-anchor="middle">
    <text x="86" y="90">GitHub</text>
    <text x="224" y="90">Actions</text>
    <text x="362" y="90">Lint</text>
    <text x="500" y="90">Docker</text>
    <text x="638" y="90">Registry</text>
    <text x="776" y="90">Cloud Run</text>
    <text x="914" y="90" fill="#3fb950" font-weight="bold">LIVE</text>
  </g>
  <g fill="#8b949e" font-size="10" text-anchor="middle">
    <text x="86" y="138">push</text>
    <text x="224" y="138">trigger</text>
    <text x="362" y="138">validate</text>
    <text x="500" y="138">build</text>
    <text x="638" y="138">push image</text>
    <text x="776" y="138">deploy</text>
    <text x="914" y="138">production</text>
  </g>

  <!-- travelling packet -->
  <circle r="5" cy="85" fill="#3fb950">
    <animate attributeName="cx" values="32;914" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4.2s" repeatCount="indefinite"/>
  </circle>
</svg>
